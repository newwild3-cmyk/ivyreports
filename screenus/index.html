<!doctype html><html lang='ko'><head><meta charset='utf-8'><title>screen_us 아카이브</title><style>
:root{color-scheme:light;--bg:#f4f5f7;--surface:#ffffff;--surface2:#f7f8fa;--line:#e3e6eb;--line2:#cfd5dd;--text:#16181d;--text2:#4a5059;--muted:#7b818b;
--s1:#2a78d6;--s1w:rgba(42,120,214,.10);--s2:#eb6834;--pos:#0f7b3f;--neg:#c62828;--head:#eef3fa;--star:#b7791f}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#121314;--surface:#1a1a19;--surface2:#222321;--line:#2e302d;--line2:#3d3f3b;
--text:#f0efec;--text2:#c3c2b7;--muted:#8f8e86;--s1:#3987e5;--s1w:rgba(57,135,229,.14);--s2:#d95926;--pos:#4cc38a;--neg:#ff7a7a;--head:#23272d;--star:#e0b252}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121314;--surface:#1a1a19;--surface2:#222321;--line:#2e302d;--line2:#3d3f3b;--text:#f0efec;--text2:#c3c2b7;--muted:#8f8e86;
--s1:#3987e5;--s1w:rgba(57,135,229,.14);--s2:#d95926;--pos:#4cc38a;--neg:#ff7a7a;--head:#23272d;--star:#e0b252}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;
font-variant-numeric:tabular-nums;letter-spacing:0;font-stretch:normal;-webkit-text-size-adjust:100%}
.page{max-width:1040px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 4px}h2{font-size:19px;margin:0}h3{font-size:15px;margin:18px 0 8px;color:var(--text2)}
.meta{color:var(--muted);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.stock-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.badge{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600;border:1px solid var(--line2);color:var(--text2);background:var(--surface2)}
.star{color:var(--star);font-weight:700}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 4px}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted)}.tile .v{font-size:19px;font-weight:700;line-height:1.3}.tile .s{font-size:12px;color:var(--text2)}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th,td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left;word-break:keep-all;overflow-wrap:anywhere}
th{background:var(--head);font-weight:600;color:var(--text)}
table.kv th{width:132px}
table.kv td ul{margin:0;padding-left:18px}table.kv td li{margin:2px 0}
table.num th,table.num td{text-align:right;white-space:nowrap;padding:7px 8px;font-size:13.5px}
table.num th:first-child,table.num td:first-child{text-align:left;width:118px;position:sticky;left:0;background:var(--surface);z-index:1}
table.num th:first-child{background:var(--head)}
table.num tr.ratio td{color:var(--text2);font-size:12.5px}table.num tr.sep td{border-top:2px solid var(--line2)}
table.sum td,table.sum th{font-size:13.5px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chart{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 10px 4px}
.chart .t{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:2px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:14px;font-family:inherit}
.chart .lbl{fill:var(--text);font-size:15px;font-weight:700}
.grid{stroke:var(--line);stroke-width:1}
.toc a{color:var(--s1);text-decoration:none}a{color:var(--s1)}
.links a{display:inline-block;margin:2px 10px 2px 0}
.disc{margin-top:26px;font-size:12.5px;color:var(--muted)}
@media(max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.charts{grid-template-columns:1fr}table.kv th{width:92px}body{font-size:14.5px}.page{padding:12px}}
</style></head><body><h1>미국장 급등 스크리너 아카이브</h1><ul><li><a href='2026-11-03.html'>2026-11-03</a> — 통과 15종목, 최고 ★</li></ul><p class='disc'>투자 참고용. 최종 판단은 본인 책임</p></body></html>
